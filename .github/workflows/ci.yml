
name: MeetTools CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - Lint, Types, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          CI: "true"

  backend:
    name: Backend API and Worker - Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build API and worker
        run: npm run build

      - name: Verify compiled API
        run: test -f dist/server.js

      - name: Verify compiled worker
        run: test -f dist/worker.js

  redis-bullmq:
    name: Redis and BullMQ - Integration Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Redis and BullMQ
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          node <<'NODE'
          const Redis = require("ioredis");
          const { Queue } = require("bullmq");

          async function main() {
            const connection = new Redis(
              process.env.REDIS_URL,
              { maxRetriesPerRequest: null }
            );

            let queue;

            try {
              const pong = await connection.ping();

              if (pong !== "PONG") {
                throw new Error("Redis connection failed");
              }

              console.log("PASS: Redis connection");

              queue = new Queue("meettools-ci-check", {
                connection,
              });

              const job = await queue.add("test-job", {
                source: "github-actions",
              });

              if (!job?.id) {
                throw new Error("BullMQ job creation failed");
              }

              console.log("PASS: BullMQ job created");

              const counts = await queue.getJobCounts(
                "waiting",
                "active",
                "failed"
              );

              if (counts.waiting < 1) {
                throw new Error("BullMQ queue check failed");
              }

              console.log("PASS: BullMQ queue");
              console.log(
                "NOTE: Real image worker not tested"
              );
            } finally {
              if (queue) {
                await queue.obliterate({ force: true });
                await queue.close();
              }

              await connection.quit();
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

  security:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Backend dependency audit
        working-directory: Backend
        run: npm audit --omit=dev --audit-level=high

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - redis-bullmq
      - security

    steps:
      - name: Confirm CI success
        run: echo "MeetTools CI checks passed!"
